#Server port
server.port= 8900

#Application name
spring.application.name= api-gateway

#Client registration options :
eureka.client.service-url.defaultZone = http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

zuul.prefix=/api
zuul.ignored-services=*

# Map paths to services
#----------------------------------
# User service :
zuul.routes.userservice.path=/accounts/**
zuul.routes.userservice.service-id=user-service

# Registration shortcut routes (legacy frontend path)
zuul.routes.registrationservice.path=/registration/**
zuul.routes.registrationservice.service-id=user-service
zuul.routes.registrationservice.strip-prefix=false

# Catalog service :
zuul.routes.catalogservice.path=/catalog/**
zuul.routes.catalogservice.service-id=product-catalog-service

# Inventory service :
zuul.routes.inventoryservice.path=/inventory/**
zuul.routes.inventoryservice.service-id=inventory-service

# Payment service :
zuul.routes.paymentservice.path=/payments/**
zuul.routes.paymentservice.service-id=payment-service

# Notification service :
zuul.routes.notificationservice.path=/notifications/**
zuul.routes.notificationservice.service-id=notification-service

# Activity log service :
zuul.routes.activitylogservice.path=/activity/**
zuul.routes.activitylogservice.service-id=activity-log-service

# Cart service (khai bao cu the truoc /shop/**):
zuul.routes.cartservice.path=/shop/cart/**
zuul.routes.cartservice.service-id=cart-service
zuul.routes.cartadminservice.path=/shop/carts/**
zuul.routes.cartadminservice.service-id=cart-service

# Order service :
zuul.routes.orderservice.path=/shop/**
zuul.routes.orderservice.service-id=order-service

# Recommendation service (legacy /review path from old times):
zuul.routes.recommendationservice.path=/review/**
zuul.routes.recommendationservice.service-id=product-recommendation-service

# Review service (new true reviews)
zuul.routes.reviewservice.path=/reviews/**
zuul.routes.reviewservice.service-id=review-service

# AI chatbot (tư vấn — gọi LLM + catalog nội bộ)
zuul.routes.aichatbotservice.path=/chatbot/**
zuul.routes.aichatbotservice.service-id=ai-chatbot-service

# Sale service (khuyến mãi, voucher, banner)
zuul.routes.saleservice.path=/sales/**
zuul.routes.saleservice.service-id=sale-service

# Telegram service (tích hợp bot)
zuul.routes.telegramservice.path=/telegram/**
zuul.routes.telegramservice.service-id=telegram-service

# SPRING SESSION (dev): disable Redis dependency for gateway
spring.session.store-type=none
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Activity log (Feign -> activity-log-service, bất đồng bộ)
activity.logging.enabled=true

# JWT - bắt buộc cấu hình qua biến môi trường JWT_SECRET (>= 64 ký tự)
# Generate via: openssl rand -base64 64
# Giá trị mặc định PHẢI trùng với user-service (nơi ký token), nếu không mọi request cần đăng nhập sẽ bị 401.
jwt.secret=${JWT_SECRET:RainbowForestEcommerceJWTSecretKey_ChangeInProduction_Min64Chars_RequiredForHS512!!}
jwt.public-paths=/api/accounts/registration,/api/accounts/registration/**,/api/registration/**,/registration/**,/api/accounts/auth/**,/api/accounts/store-contact,/api/accounts/store-contact/**,/api/accounts/users/*/avatar/file/**,/api/accounts/users/**/avatar/file/**,/api/notifications/**,/api/catalog/**,/api/inventory/**,/api/shop/cart/**,/api/shop/orders/check,/api/shop/orders/check/**,/api/review/**,/api/chatbot/**,/api/accounts/addresses/**,/api/sales/active,/api/sales/banners,/api/sales/banners/image/**,/api/sales/vouchers/validate,/api/sales/vouchers/active,/api/reviews/reviews/product/**,/api/reviews/media/**,/api/payments/sepay/webhook,/api/payments/payos/webhook,/api/payments/vnpay/return,/api/payments/vnpay/ipn

# JWT expiration (milliseconds)
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# Internal Service-to-Service Secret - bắt buộc cấu hình qua env INTERNAL_SERVICE_SECRET
# Generate via: openssl rand -base64 48
# Đã set giá trị dev mặc định (>= 32 ký tự). Production nên override bằng env INTERNAL_SERVICE_SECRET.
internal.service.secret=${INTERNAL_SERVICE_SECRET:TQjHHfANqChwqKF4nQ0im06mCAhbscepCwvzYUMz/b5CmXiUULFl2NZxOx8HZcfK}

#SECURITY
#---------------------------------
zuul.sensitive-headers=

# Timeout de tranh 504 khi service khoi dong cham / request dau tien
ribbon.ConnectTimeout=5000
ribbon.ReadTimeout=30000
hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=80000
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
zuul.host.max-total-connections=500
zuul.host.max-per-route-connections=100

# Allow forwarding larger multipart payloads (avatar upload)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Rate limit config (Multi-tier Token Bucket via Bucket4j)
rate-limit.enabled=${APP_SECURITY_RATE_LIMIT_ENABLED:true}
rate-limit.local-bypass=${APP_RATE_LIMIT_LOCAL_BYPASS:false}
rate-limit.general.requests-per-minute=${APP_RATE_LIMIT_GENERAL:150}
rate-limit.auth.requests-per-minute=${APP_RATE_LIMIT_AUTH:15}
rate-limit.checkout.requests-per-minute=${APP_RATE_LIMIT_CHECKOUT:30}
rate-limit.user.requests-per-minute=${APP_RATE_LIMIT_USER:300}
rate-limit.admin.requests-per-minute=${APP_RATE_LIMIT_ADMIN:1000}

# Cookie security (set true khi chạy trên HTTPS production)
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:false}

# CORS - cấu hình qua env APP_SECURITY_CORS_ALLOWED_ORIGINS (comma-separated)
# Default: localhost dev. Production nên set cụ thể domain.
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Tắt hoàn toàn các endpoint actuator nhạy cảm qua gateway; giữ health/prometheus ở service.
management.endpoints.web.exposure.include=health,info,prometheus