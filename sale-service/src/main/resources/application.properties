#Server port
server.port=8816

#Application name
spring.application.name=sale-service

#Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Data source — MySQL (auto-create DB)
spring.datasource.url=jdbc:mysql://localhost:3306/sale?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=20000

# Inventory service URL (for stock validation via Feign)
inventory.service.url=http://localhost:8900

# Internal Service-to-Service Secret (phải trùng với api-gateway / order-service / payment-service)
internal.service.secret=${INTERNAL_SERVICE_SECRET:TQjHHfANqChwqKF4nQ0im06mCAhbscepCwvzYUMz/b5CmXiUULFl2NZxOx8HZcfK}

# Feign timeout config
feign.client.config.default.connectTimeout=10000
feign.client.config.default.readTimeout=60000

# Spring Boot Actuator + Prometheus Metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Swagger / OpenAPI 3 Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false
